name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

jobs:
  ci:
    name: lint · typecheck · test · build · audit
    runs-on: [self-hosted, ts]
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # En el runner self-hosted el node por defecto (imagen myoung34) es antiguo y
      # rompe el self-installer de pnpm; setup-node primero garantiza Node 22 en PATH.
      # El store de pnpm persiste en el volumen del runner, así que no se usa cache:.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Typecheck (apps/web)
        run: pnpm --filter @atlaps/web typecheck

      - name: Build (apps/web)
        run: pnpm --filter @atlaps/web build

      - name: Audit
        run: pnpm audit --audit-level=high

  e2e:
    name: e2e · playwright + axe
    runs-on: [self-hosted, ts]
    needs: ci
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # En el runner self-hosted el node por defecto (imagen myoung34) es antiguo y
      # rompe el self-installer de pnpm; setup-node primero garantiza Node 22 en PATH.
      # El store de pnpm persiste en el volumen del runner, así que no se usa cache:.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (next + socios)
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (playwright + axe)
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
