packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# pnpm 11 reads overrides here, not from package.json#pnpm.
# Transitivas cuyo padre no puede subir al mínimo parchado (Dependabot 2026-10-31).
overrides:
  vite: ">=8.1.6" # GHSA-587h-7wmj-h5pm
  # fast-uri 3.x y 4.x tienen parches distintos; forzar ambos rangos.
  fast-uri@>=3 <4: ">=3.1.6 <4"
  fast-uri@>=4 <5: ">=4.2.3 <5" # GHSA-333x-w4r6-6crp, GHSA-xhq7-xmqj-769h, medias
  postcss: ">=8.5.18"
  brace-expansion@>=1 <2: ">=1.1.21 <2" # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7
  brace-expansion@>=2 <3: ">=2.0.2 <3"
  brace-expansion@>=3: ">=5.0.12" # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7
  js-yaml@>=4 <5: ">=4.3.2 <5"
  nanoid@>=3 <4: ">=3.3.18 <4"
  browserslist: ">=4.28.7"
  undici@>=7 <8: ">=7.30.1 <8" # GHSA-xjj6-f33q-929c
  sharp: ">=0.35.5" # GHSA-wq5f-xc86-pv6w (vía next)
  source-map-js: ">=1.2.2" # GHSA-68fv-2mgg-jv7q
  zod@>=4 <5: ">=4.6.6 <5" # GHSA-mrhx-c7xc-m3w5
  baseline-browser-mapping: ">=2.11.0" # GHSA-w5vr-8v7q-w6rv
