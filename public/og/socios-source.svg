<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE5D2"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#C9BFAA" stroke-width="0.4" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background paper-bone con sutil grid (blueprint paper) -->
  <rect width="1200" height="630" fill="url(#paperGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Topographic isolines · blueprint-soft -->
  <g fill="none" stroke="#3A7BB8" stroke-width="1.2" opacity="0.32">
    <path d="M -50 470 C 200 440, 380 510, 600 480 S 1000 420, 1250 460"/>
    <path d="M -50 440 C 200 410, 380 480, 600 450 S 1000 390, 1250 430"/>
    <path d="M -50 410 C 200 380, 380 450, 600 420 S 1000 360, 1250 400"/>
    <path d="M -50 380 C 200 350, 380 420, 600 390 S 1000 330, 1250 370"/>
    <path d="M -50 350 C 200 320, 380 390, 600 360 S 1000 300, 1250 340"/>
  </g>

  <!-- Constellation: 7 nodes connected by lines (homenaje al claim "constelaciones domésticas") -->
  <g stroke="#1E4D7A" stroke-width="1" opacity="0.55" fill="none" stroke-dasharray="3 3">
    <line x1="900" y1="120" x2="1020" y2="180"/>
    <line x1="1020" y1="180" x2="1100" y2="120"/>
    <line x1="1020" y1="180" x2="1080" y2="280"/>
    <line x1="1080" y1="280" x2="980" y2="340"/>
    <line x1="980" y1="340" x2="900" y2="260"/>
    <line x1="900" y1="260" x2="900" y2="120"/>
    <line x1="900" y1="260" x2="1020" y2="180"/>
  </g>
  <g fill="#0F2A4A">
    <circle cx="900" cy="120" r="5"/>
    <circle cx="1020" cy="180" r="6.5"/>
    <circle cx="1100" cy="120" r="4"/>
    <circle cx="1080" cy="280" r="5"/>
    <circle cx="980" cy="340" r="4.5"/>
    <circle cx="900" cy="260" r="5.5"/>
  </g>
  <!-- Estrella central ámbar -->
  <circle cx="1020" cy="180" r="11" fill="none" stroke="#A85F1C" stroke-width="1.5" opacity="0.85"/>

  <!-- Logo monograma (atlaps icon · stroke 0F2A4A) ampliado, esquina sup. izq. -->
  <g transform="translate(72 72) scale(0.95)" stroke="#0F2A4A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Reproducción del icon SVG existente · trazo blueprint -->
    <circle cx="32" cy="32" r="28"/>
    <path d="M 16 44 L 32 16 L 48 44"/>
    <path d="M 22 36 L 42 36"/>
  </g>
  <text x="148" y="102" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="500" letter-spacing="0.06em" fill="#0F2A4A">atlaps</text>
  <text x="148" y="128" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.18em" fill="#4B5563" text-transform="uppercase">DOC. CONFIDENCIAL · v0.1 · 2026</text>

  <!-- Línea separadora ámbar -->
  <line x1="72" y1="220" x2="220" y2="220" stroke="#A85F1C" stroke-width="2"/>

  <!-- Claim principal -->
  <text x="72" y="290" font-family="Fraunces, Georgia, serif" font-size="48" font-weight="500" fill="#0F2A4A" letter-spacing="-0.01em">
    <tspan x="72" dy="0">Constelaciones domésticas</tspan>
    <tspan x="72" dy="58">de dispositivos inteligentes</tspan>
  </text>
  <text x="72" y="430" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#4B5563" letter-spacing="0.005em">
    <tspan x="72" dy="0">que tú mismo puedes idear,</tspan>
    <tspan x="72" dy="32">instalar y activar.</tspan>
  </text>

  <!-- Pie -->
  <line x1="72" y1="540" x2="1128" y2="540" stroke="#C9BFAA" stroke-width="1"/>
  <text x="72" y="572" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.14em" fill="#1E4D7A">INICIATIVA ALEXENDROS, S.L.</text>
  <text x="72" y="592" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.12em" fill="#4B5563">COMUNITAT VALENCIANA · ATLAS · APPS · DOMÓTICA MULTI-PROTOCOLO</text>
  <text x="1128" y="572" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.14em" fill="#A85F1C">/SOCIOS · v0.1</text>
</svg>
