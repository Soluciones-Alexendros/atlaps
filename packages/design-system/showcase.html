<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlaps · Design System</title>

<link rel="stylesheet" href="public/fonts/fonts.css" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="public/fonts/inter-variable.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="public/fonts/fraunces-variable.woff2" />

<style>
/* ============================================================
   Atlaps Showcase — inline tokens (mirror of tokens.css)
   ============================================================ */
:root {
  /* Blueprint */
  --blueprint-deep: #0F2A4A;
  --blueprint-mid:  #1E4D7A;
  --blueprint-soft: #3A7BB8;
  /* Paper */
  --paper-bone: #F5F1E8;
  --paper-grid: #E8E0CC;
  /* Amber */
  --amber-signal: #C77D2C;
  --amber-glow:   #E89642;
  /* Ink */
  --ink-graphite: #1A1F2E;
  --ink-pencil:   #5C6B7F;
  /* Semantic */
  --success: #2F8F5C;
  --warning: #C77D2C;
  --danger:  #B23A48;
  --info:    #3A7BB8;

  /* Theme tokens (light) */
  --bg:          var(--paper-bone);
  --bg-elev:     #FAF6EE;
  --grid:        var(--paper-grid);
  --fg:          var(--blueprint-deep);
  --fg-soft:     var(--ink-pencil);
  --line:        var(--blueprint-mid);
  --line-soft:   #C9BFAA;
  --accent:      var(--amber-signal);
  --accent-glow: var(--amber-glow);
  --amber-on-surface: var(--amber-signal); /* Decisión 2 · token canónico texto/badge/CTA */

  /* Type */
  --font-display: "Fraunces", Georgia, serif;
  --font-body:    "Inter", system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, monospace;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg:          var(--blueprint-deep);
  --bg-elev:     #143257;
  --grid:        rgba(232, 224, 204, 0.08);
  --fg:          var(--paper-bone);
  --fg-soft:     #A6B5C9;
  --line:        var(--blueprint-soft);
  --line-soft:   rgba(58, 123, 184, 0.35);
  --accent:      var(--amber-glow);
  --accent-glow: var(--amber-signal);
  --amber-on-surface: var(--amber-glow); /* Decisión 2 · oscuro promueve a glow ~5.5:1 AA */
}

/* Decisión 1 · surface switch · marketing (default) | app */
[data-surface="app"], [data-typeset="b"] {
  --font-display: "Inter Tight", "Inter", system-ui, sans-serif;
  --font-body:    "Geist", system-ui, sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-position: -1px -1px;
  transition: background-color var(--ease) 240ms, color var(--ease) 240ms;
}

::selection { background: var(--accent); color: var(--paper-bone); }

a { color: inherit; }

/* ===== Header ===== */
.atlaps-header {
  position: sticky;
  top: 0;
  z-index: 1100;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line-soft);
}
.atlaps-header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 32px;
}
.atlaps-header nav {
  display: flex;
  gap: 4px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
.atlaps-header nav::-webkit-scrollbar { display: none; }
.atlaps-header nav a {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-soft);
  text-decoration: none;
  padding: 8px 10px;
  border-radius: 4px;
  white-space: nowrap;
  transition: color 120ms var(--ease), background 120ms var(--ease);
}
.atlaps-header nav a:hover {
  color: var(--fg);
  background: var(--grid);
}

.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg);
  cursor: pointer;
  transition: all 120ms var(--ease);
}
.theme-toggle:hover { background: var(--bg-elev); border-color: var(--accent); }

/* ===== Layout shell ===== */
main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 64px 32px 128px;
}

section.ds-section {
  padding: 80px 0;
  border-top: 1px solid var(--line-soft);
  scroll-margin-top: 80px;
}
section.ds-section:first-of-type { border-top: none; padding-top: 32px; }

.section-head {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 48px;
  margin-bottom: 48px;
  align-items: baseline;
}
.section-head .label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-soft);
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-head .label::before {
  content: "";
  width: 24px;
  height: 1px;
  background: var(--line);
}
.section-head h2 {
  font-family: var(--font-display);
  font-size: 49px;
  line-height: 1.05;
  letter-spacing: -0.02em;
  font-weight: 500;
  margin: 0 0 8px;
}
.section-head p {
  color: var(--fg-soft);
  margin: 0;
  max-width: 560px;
  font-size: 16px;
}

@media (max-width: 768px) {
  .section-head { grid-template-columns: 1fr; gap: 16px; }
  .section-head h2 { font-size: 31px; }
  main { padding: 32px 16px 64px; }
  .atlaps-header-inner { padding: 12px 16px; gap: 16px; }
}

/* ===== Type scale baseline ===== */
.t-display-1 { font-family: var(--font-display); font-size: 61px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 500; }
.t-display-2 { font-family: var(--font-display); font-size: 49px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 500; }
.t-h1 { font-family: var(--font-display); font-size: 39px; line-height: 1.10; letter-spacing: -0.01em; font-weight: 500; }
.t-h2 { font-family: var(--font-display); font-size: 31px; line-height: 1.20; font-weight: 500; }
.t-h3 { font-family: var(--font-body); font-size: 25px; line-height: 1.20; font-weight: 600; }
.t-h4 { font-family: var(--font-body); font-size: 20px; line-height: 1.30; font-weight: 600; }
.t-body { font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.t-small { font-family: var(--font-body); font-size: 14px; line-height: 1.50; }
.t-caption { font-family: var(--font-mono); font-size: 12px; line-height: 1.40; letter-spacing: 0.04em; }

/* ===== Generic primitives ===== */
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; }
.kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-soft);
}

.divider {
  height: 1px;
  background: var(--line-soft);
  margin: 24px 0;
}

/* Card with paper grid background */
.paper-card {
  background: var(--bg-elev);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  padding: 24px;
  position: relative;
}
.paper-card.gridded {
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 16px 16px;
}

/* Demo frames (dual light/dark side-by-side) */
.demo-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 768px) { .demo-pair { grid-template-columns: 1fr; } }

.demo-frame {
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  padding: 32px;
  position: relative;
  overflow: hidden;
}
.demo-frame.light {
  background: var(--paper-bone);
  color: var(--blueprint-deep);
}
.demo-frame.dark {
  background: var(--blueprint-deep);
  color: var(--paper-bone);
}
.demo-frame::before {
  content: attr(data-mode);
  position: absolute;
  top: 8px;
  right: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.5;
}

/* ===== Loading spinner (used in Button) ===== */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 14px;
  height: 14px;
  border: 1.5px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 720ms linear infinite;
}

/* ===== Reset for code blocks ===== */
pre, code {
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
}
pre {
  background: var(--bg-elev);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  padding: 16px 20px;
  overflow-x: auto;
  margin: 0;
}

/* hide tweaks panel close visual default polish handled by starter */
</style>

<script>
  // Persist theme choice
  (function () {
    try {
      const t = localStorage.getItem("atlaps-theme");
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      const ts = localStorage.getItem("atlaps-typeset");
      if (ts === "b") document.documentElement.setAttribute("data-typeset", "b");
    } catch (e) {}
  })();
</script>
</head>

  <div id="root"></div>

  <script src="vendor/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="vendor/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

</body>
</html>
