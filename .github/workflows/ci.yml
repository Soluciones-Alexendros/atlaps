name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  ci:
    name: lint · typecheck · test · build · audit
    runs-on: [self-hosted, ts]
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # En el runner self-hosted el node por defecto (imagen myoung34) es antiguo y
      # rompe el self-installer de pnpm; setup-node primero garantiza Node 22 en PATH.
      # El store de pnpm persiste en el volumen del runner, así que no se usa cache:.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workflows (actionlint)
        run: |
          curl -sLO https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash
          bash download-actionlint.bash
          ./actionlint --config-file actionlint.yaml

      - name: Audit workflows (zizmor)
        run: |
          curl -sL https://github.com/zizmorcore/zizmor/releases/download/v1.26.1/zizmor-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./zizmor .github/workflows/

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Typecheck (apps/web)
        run: pnpm --filter @atlaps/web typecheck

      - name: Build (apps/web)
        run: pnpm --filter @atlaps/web build

      - name: Audit
        run: pnpm audit --audit-level=high

  e2e:
    name: e2e · playwright + axe
    runs-on: [self-hosted, ts]
    needs: ci
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # En el runner self-hosted el node por defecto (imagen myoung34) es antiguo y
      # rompe el self-installer de pnpm; setup-node primero garantiza Node 22 en PATH.
      # El store de pnpm persiste en el volumen del runner, así que no se usa cache:.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (next + socios)
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (playwright + axe)
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
