packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# pnpm 11 reads overrides here, not from package.json#pnpm.
overrides:
  vite: ">=8.0.16"
  fast-uri: ">=3.1.6"
  postcss: ">=8.5.18"
  brace-expansion@>=1 <2: ">=1.1.18 <2"
  brace-expansion@>=2 <3: ">=2.0.2 <3"
  brace-expansion@>=3: ">=5.0.9"
  js-yaml@>=4 <5: ">=4.3.2 <5"
  nanoid@>=3 <4: ">=3.3.18 <4"
  browserslist: ">=4.28.7"
  undici@>=7 <8: ">=7.29.0 <8"
  sharp: ">=0.35.4"
