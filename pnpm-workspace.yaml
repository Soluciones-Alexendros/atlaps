packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# pnpm 11 reads overrides here, not from package.json#pnpm.
overrides:
  vite: ">=8.1.6"
  fast-uri: ">=3.1.6"
  postcss: ">=8.5.18"
  brace-expansion@>=1 <2: ">=1.1.20 <2"
  brace-expansion@>=2 <3: ">=2.0.2 <3"
  brace-expansion@>=3: ">=5.0.11"
  js-yaml@>=4 <5: ">=4.3.2 <5"
  nanoid@>=3 <4: ">=3.3.18 <4"
  browserslist: ">=4.28.7"
  undici@>=7 <8: ">=7.30.1 <8"
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
  zod@>=4 <5: ">=4.6.6 <5"
